<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Track pickleball drill sessions on the court, then export results to your PC.">
  <title>Pickleball Drills</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <h1>Pickleball Drills</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-action="tab" data-tab="plans"><span aria-hidden="true">📋</span>Plans</button>
    <button data-action="tab" data-tab="session"><span aria-hidden="true">⏱️</span>Session</button>
    <button data-action="tab" data-tab="history"><span aria-hidden="true">📈</span>History</button>
    <button data-action="tab" data-tab="data"><span aria-hidden="true">💾</span>Data</button>
  </nav>

  <input type="file" id="fileInput" accept=".json,.csv,.txt,application/json,text/csv,text/plain" multiple hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
  <div id="alarmBar" class="alarm-bar" role="alert" hidden>
    <button class="btn" data-action="stop-alarm">🔕 Time’s up! Tap to stop alarm</button>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
